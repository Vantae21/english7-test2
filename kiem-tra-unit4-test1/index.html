<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiểm tra Unit 4 · Test 01 · English 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#241447;--mu:#64607f;--bg:#fff7ec;--pink:#ff5fa2;--vio:#7a5cff;--teal:#12b5a0;--yel:#ffd23f;--ok:#0f9f6e;--no:#e0345e;--head:"Baloo 2","Nunito",sans-serif;--body:"Nunito",system-ui,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;background:var(--bg);background-image:radial-gradient(circle at 12% 8%,#ffe1ef 0,transparent 32%),radial-gradient(circle at 90% 30%,#e3dcff 0,transparent 30%),radial-gradient(circle at 20% 80%,#d4f6ee 0,transparent 30%);}
.notes{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}.notes span{position:absolute;bottom:-40px;opacity:.16;color:var(--vio);animation:rise linear infinite}@keyframes rise{to{transform:translateY(-115vh) rotate(25deg)}}
.wrap{position:relative;z-index:1;max-width:840px;margin:0 auto;padding:16px 14px 90px}
.hero{position:relative;overflow:hidden;padding:26px 24px;border-radius:28px;color:#fff;background:linear-gradient(135deg,#7a5cff,#ff5fa2 70%,#ff9f1c);box-shadow:0 10px 0 #241447,0 14px 30px rgba(36,20,71,.25);border:4px solid var(--ink);display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.hero:after{content:"";position:absolute;right:-50px;bottom:-70px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.18)}
.kick{display:inline-block;background:var(--yel);color:var(--ink);font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 12px;border-radius:99px;border:2.5px solid var(--ink)}
.hero h1{margin:10px 0 2px;font:800 clamp(2rem,7vw,3.2rem)/1.02 var(--head);text-shadow:3px 3px 0 var(--ink)}.hero p{margin:0;font-weight:800;opacity:.95}
.vinyl{width:120px;height:120px;animation:spin 7s linear infinite;position:relative;z-index:1}@keyframes spin{to{transform:rotate(360deg)}}
.card{background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--ink);padding:16px 18px;margin:18px 0}
.info{display:grid;grid-template-columns:auto 1fr auto 130px;gap:8px 12px;align-items:center;font-weight:800}
input[type=text]{font:inherit;font-weight:700;color:var(--ink);padding:9px 12px;border:3px solid var(--ink);border-radius:12px;min-width:0;width:100%;background:#fffdf7}
.bar{position:sticky;top:0;z-index:10;margin:0 -6px;padding:10px 6px 6px;background:transparent}
.bar-in{display:flex;align-items:center;gap:12px;padding:8px 14px;border:3px solid var(--ink);border-radius:16px;background:var(--yel);box-shadow:4px 4px 0 var(--ink);font-weight:800}
.bar-in b{font-family:var(--head);white-space:nowrap}.meter{flex:1;height:14px;border:2.5px solid var(--ink);border-radius:9px;background:#fff;overflow:hidden}.meter i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--pink) 0 9px,#fff0 9px 12px);transition:width .3s}
.grp{margin:26px 0;padding:0 0 6px;border:3px solid var(--ink);border-radius:24px;background:#fff;box-shadow:6px 6px 0 var(--c);overflow:hidden}
.gh{display:flex;gap:12px;align-items:center;padding:12px 16px;background:var(--c);color:#fff;border-bottom:3px solid var(--ink)}
.gi{flex:none;width:46px;height:46px;display:grid;place-items:center;font-size:1.5rem;background:#fff;border:3px solid var(--ink);border-radius:50%}
.gt{font:800 1.25rem/1.15 var(--head);text-shadow:2px 2px 0 rgba(36,20,71,.5)}.gs{font-weight:700;font-size:.9rem;opacity:.95}
.pas{margin:14px 16px 4px;padding:12px 16px;border-radius:14px;font-family:Georgia,"Times New Roman",serif;font-size:1.02rem;line-height:1.75;background:#fffdf3 repeating-linear-gradient(transparent 0 27px,#e8e2c9 27px 28px);border:2.5px dashed #bfa9ff}
.pas h4{margin:0 0 6px;text-align:center;font-family:var(--head)}.pas p{margin:6px 0}.pas .ph{padding:6px 10px;background:#f1ebff;border-radius:8px}.pas .bl{color:var(--vio);font-weight:700}
.q{margin:10px 16px 0;padding:12px 0 6px;border-top:2px dotted #d8d2ee}.q:first-of-type{border-top:0}
.qt{display:flex;gap:12px;align-items:flex-start;font-weight:800;font-size:1.06rem}
.n{flex:none;min-width:36px;height:36px;display:grid;place-items:center;border-radius:12px;background:var(--ink);color:#fff;font:800 1rem var(--head);transition:background .2s}
.q.done .n{background:var(--teal)}
.pic{display:block;max-width:100%;max-height:150px;margin:8px 0 0 48px;border:3px solid var(--ink);border-radius:12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0 0 48px}
.op{display:flex;gap:10px;align-items:center;text-align:left;font:inherit;font-weight:700;color:var(--ink);padding:9px 12px;border:3px solid var(--ink);border-radius:14px;background:#fff;cursor:pointer;min-width:0;overflow-wrap:anywhere;transition:transform .1s,box-shadow .1s}
.op .l{flex:none;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:#efeaff;border:2px solid var(--ink);font-size:.85rem}
.op:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--ink);background:#fff6d2}
.op.picked{background:#e6e0ff;box-shadow:3px 3px 0 var(--vio)}.op.picked .l{background:var(--vio);color:#fff}
.op.good{background:#d7f7e8;border-color:var(--ok)}.op.good .l{background:var(--ok);color:#fff;border-color:var(--ok)}
.op.bad{background:#ffdce5;border-color:var(--no)}.op.bad .l{background:var(--no);color:#fff;border-color:var(--no)}
.exp{display:none;margin:10px 0 4px 48px;padding:10px 14px;border-radius:14px;border:2.5px solid;font-size:.95rem;font-weight:600}.exp.on{display:block}
.exp.ok{border-color:var(--ok);background:#e4f8ee}.exp.no{border-color:var(--no);background:#ffe9ee}
.fin{text-align:center;margin-top:24px}#warn{min-height:1.4em;margin-bottom:8px;font-weight:800;color:#b45309}#warn.err{color:var(--no)}
.btn{font:800 1.1rem var(--head);padding:12px 26px;border:3px solid var(--ink);border-radius:16px;background:var(--pink);color:#fff;box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}.btn:disabled{opacity:.6}.btn.w{background:#fff;color:var(--ink)}
.res{display:none;text-align:center}.res.on{display:block;animation:pop .4s}@keyframes pop{from{transform:scale(.92);opacity:0}}
.ring{--p:0%;width:170px;height:170px;margin:6px auto 10px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--teal) var(--p),#e6e0ff 0);border:4px solid var(--ink);position:relative}
.ring:before{content:"";position:absolute;inset:14px;background:#fff;border-radius:50%;border:3px solid var(--ink)}
.ring b{position:relative;font:800 2.6rem var(--head);color:var(--vio);text-shadow:2px 2px 0 var(--ink)}
.rem{font:800 1.5rem var(--head)}.ten{font-weight:800;font-size:1.15rem}
.brk{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin:14px 0;text-align:left;font-weight:700;font-size:.92rem}.brk div{display:flex;justify-content:space-between;gap:8px;padding:6px 12px;border:2.5px solid var(--ink);border-radius:12px;background:#fffdf7}
.mail{margin:12px 0;padding:10px 14px;border:3px solid var(--ink);border-radius:14px;font-weight:800;background:#fff}.mail.ok{background:#d7f7e8}.mail.err{background:#fff0c9}
.cf{position:fixed;top:-12px;width:10px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}@keyframes fall{to{top:105vh;transform:rotate(720deg)}}
button:focus-visible,input:focus-visible{outline:4px solid var(--teal);outline-offset:2px}
@media(max-width:620px){.hero{grid-template-columns:1fr}.vinyl{position:absolute;right:12px;top:12px;width:80px;height:80px}.info{grid-template-columns:auto 1fr}.opts,.pic,.exp{margin-left:0}.opts{grid-template-columns:1fr}.brk{grid-template-columns:1fr}.q{margin:10px 12px 0}.pas{margin:12px 12px 4px}body{font-size:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="notes" id="notes" aria-hidden="true"></div>
<div class="wrap">
<header class="hero"><div><span class="kick">English 7 · Unit 4</span><h1 id="tt"></h1><p id="ts"></p><p style="margin-top:8px">👩‍🏫 Ms. Kim Anh</p></div>
<svg class="vinyl" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="96" fill="#241447"/><circle cx="100" cy="100" r="78" fill="none" stroke="#4a3a85" stroke-width="2"/><circle cx="100" cy="100" r="62" fill="none" stroke="#4a3a85" stroke-width="2"/><circle cx="100" cy="100" r="34" fill="#ffd23f" stroke="#fff" stroke-width="3"/><circle cx="100" cy="100" r="6" fill="#241447"/><path d="M100 66a34 34 0 0 1 34 34" stroke="#ff5fa2" stroke-width="10" fill="none" stroke-linecap="round"/></svg></header>
<div class="card"><div class="info"><label for="nm">👤 Họ và tên</label><input id="nm" type="text" autocomplete="name" placeholder="Nguyễn Văn A"><label for="cl">🏫 Lớp</label><input id="cl" type="text" autocomplete="off" placeholder="7A1"></div></div>
<div class="bar"><div class="bar-in"><b>🎵 Tiến độ</b><div class="meter"><i id="pf"></i></div><b id="cnt">0/40 câu</b></div></div>
<main id="quiz"></main>
<div class="fin"><div id="warn"></div><button class="btn" id="sub" type="button">🎤 Nộp bài</button></div>
<div class="card res" id="res">
  <div class="rem" id="rem"></div><div class="ring" id="ring"><b id="rb"></b></div><div class="ten" id="rt"></div><div id="rw" style="color:var(--mu);font-weight:700"></div>
  <div class="brk" id="rk"></div><div class="mail" id="mail"></div>
  <button class="btn w" id="cp" type="button">📋 Sao chép kết quả</button> <button class="btn" id="top" type="button">📖 Xem lại bài &amp; giải thích</button>
</div>
</div>
<script src="config.js"></script><script src="data.js"></script>
<script>
const $=id=>document.getElementById(id),CFG=window.QUIZ_CONFIG||{},TEST=window.TEST,QS=TEST.q,TOTAL=QS.length,LT='ABCD';
$('tt').textContent=TEST.sub;$('ts').textContent='Grade 7 · '+TEST.title;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sel={};let graded=false,confirmed=false,T0=Date.now(),tEnd=0,mailSent=false,sending=false,payload=null;
const ICON={g1:'🔤',g2:'🥁',g3:'✏️',g4:'🎨',g5:'💌',g6:'🖼️',g7:'🔁',g8:'🧩',g9:'🚧',g10:'📖',g11:'🎻'},COL=['#ff5fa2','#7a5cff','#12b5a0','#ff9f1c','#3b82f6','#ef476f'];
(function(){let g='',h='',gi=-1;
 QS.forEach(q=>{const G=TEST.groups[q.g];
  if(q.g!==g){if(g)h+='</section>';g=q.g;gi++;const nums=QS.filter(x=>x.g===g).map(x=>x.n);
   h+='<section class="grp" style="--c:'+COL[gi%COL.length]+'"><div class="gh"><span class="gi">'+ICON[g]+'</span><div><div class="gt">'+G.short+'</div><div class="gs">'+(nums.length>1?'Câu '+nums[0]+'–'+nums[nums.length-1]:'Câu '+nums[0])+' · '+G.inst+'</div></div></div>'+(G.passage?'<div class="pas">'+G.passage.replace(/class="bl" data-b="\d+"/g,'class="bl"')+'</div>':'');}
  h+='<div class="q" id="q'+q.n+'"><div class="qt"><span class="n">'+q.n+'</span><span>'+q.q+'</span></div>'+(q.img?'<img class="pic" src="'+q.img+'" alt="Biển báo">':'')+
   '<div class="opts">'+q.o.map((t,i)=>'<button type="button" class="op" data-q="'+q.n+'" data-i="'+i+'"><span class="l">'+LT[i]+'</span><span>'+t+'</span></button>').join('')+'</div><div class="exp" id="e'+q.n+'"></div></div>';});
 $('quiz').innerHTML=h+'</section>';
 document.querySelectorAll('.op').forEach(b=>b.onclick=()=>{if(graded)return;const n=+b.dataset.q;sel[n]=+b.dataset.i;
  document.querySelectorAll('.op[data-q="'+n+'"]').forEach(x=>x.classList.toggle('picked',x===b));document.getElementById('q'+n).classList.add('done');prog();});
 const N=$('notes'),G=['♪','♫','♬','🎨','🎻','🎸','🥁','🎤'];for(let i=0;i<14;i++){const e=document.createElement('span');e.textContent=G[i%G.length];e.style.left=(Math.random()*96)+'%';e.style.animationDuration=(16+Math.random()*18)+'s';e.style.animationDelay=(-Math.random()*20)+'s';e.style.fontSize=(20+Math.random()*22)+'px';N.appendChild(e);}
})();
function prog(){const n=Object.keys(sel).length;$('cnt').textContent=n+'/'+TOTAL+' câu';$('pf').style.width=(n/TOTAL*100)+'%';}
function confetti(){const c=['#ff5fa2','#ffd23f','#2ad4b8','#7a5cff','#ff9f1c'],B=document.body;for(let i=0;i<70;i++){const p=document.createElement('i');p.className='cf';p.style.left=Math.random()*100+'vw';p.style.background=c[i%5];p.style.animationDuration=(2+Math.random()*2.5)+'s';p.style.animationDelay=(Math.random()*.6)+'s';p.style.transform='rotate('+Math.random()*360+'deg)';B.appendChild(p);setTimeout(()=>p.remove(),5500);}}
function grade(){
  graded=true;tEnd=Date.now();let ok=0;const by={};
  QS.forEach(q=>{const j=sel[q.n],has=j!==undefined,good=has&&j===q.c;if(good)ok++;const b=by[q.g]||(by[q.g]={t:0,ok:0});b.t++;if(good)b.ok++;
   document.querySelectorAll('.op[data-q="'+q.n+'"]').forEach(x=>{x.disabled=true;const i=+x.dataset.i;x.classList.remove('picked');if(i===q.c)x.classList.add('good');else if(has&&i===j)x.classList.add('bad');});
   const e=$('e'+q.n);e.className='exp on '+(good?'ok':'no');e.innerHTML='<b>'+(good?'Đúng.':has?'Chưa đúng.':'Chưa làm.')+'</b> Đáp án: <b>'+LT[q.c]+'</b>. '+q.e;});
  return{ok,by};
}
const fmt=s=>Math.floor(s/60)+' phút '+String(s%60).padStart(2,'0')+' giây';
function text(R){
  let m='KIỂM TRA '+TEST.title.toUpperCase()+' ('+TEST.sub+')\nHọc sinh: '+$('nm').value.trim()+'\nLớp: '+$('cl').value.trim()+'\nNộp lúc: '+new Date().toLocaleString('vi-VN')+'\nThời gian làm: '+fmt(Math.round((tEnd-T0)/1000))+'\nĐIỂM: '+R.ok+'/'+TOTAL+' ('+(R.ok*10/TOTAL).toFixed(2).replace(/\.?0+$/,'')+'/10)\n\nTheo phần:\n';
  Object.keys(TEST.groups).forEach(k=>{m+='- '+TEST.groups[k].short+': '+R.by[k].ok+'/'+R.by[k].t+'\n';});
  m+='\nCHI TIẾT TỪNG CÂU\n';QS.forEach(q=>{const j=sel[q.n];m+='Câu '+q.n+': '+(j===undefined?'CHƯA LÀM':j===q.c?'ĐÚNG':'SAI | con chọn '+LT[j]+' | đáp án '+LT[q.c])+'\n';});return m;
}
function setMail(c,h){const e=$('mail');e.className='mail '+c;e.innerHTML=h;}
async function post(p){const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),20000);
 try{const r=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(p),signal:ctl.signal});let j={};try{j=await r.json();}catch(e){}
  if(r.ok&&j.success)return{ok:true};return{ok:false,msg:j.message||('Mã lỗi '+r.status),fatal:[400,401,403].includes(r.status)};
 }catch(e){return{ok:false,msg:e.name==='AbortError'?'Hết thời gian chờ':'Không có kết nối mạng'};}finally{clearTimeout(to);}}
async function sendMail(){
  if(sending||mailSent)return;
  if(!CFG.MAIL_ACCESS_KEY||/PASTE_ACCESS_KEY/.test(CFG.MAIL_ACCESS_KEY)){setMail('err','Trang chưa cài địa chỉ nhận bài. Con bấm “Sao chép kết quả” rồi gửi cô qua Zalo nhé.');return;}
  sending=true;setMail('','Đang gửi bài cho cô… (con đừng đóng trang nhé)');let last;
  for(let t=0;t<3;t++){last=await post(payload);if(last.ok||last.fatal)break;if(t<2)await new Promise(r=>setTimeout(r,1500*(t+1)));}
  sending=false;
  if(last.ok){mailSent=true;setMail('ok','✅ Bài làm của con đã được gửi đến cô. Con không cần làm gì thêm!');}
  else{setMail('err','⚠️ Chưa gửi được ('+esc(last.msg)+'). Con kiểm tra mạng rồi bấm gửi lại, hoặc sao chép kết quả gửi cô qua Zalo.<br><button class="btn" type="button" id="rs" style="margin-top:8px;padding:8px 16px">Gửi lại cho cô</button>');$('rs').onclick=sendMail;}
}
$('sub').onclick=function(){
  if(graded)return;const w=$('warn');
  if(!$('nm').value.trim()||!$('cl').value.trim()){w.className='err';w.textContent='Con hãy nhập Họ tên và Lớp ở đầu bài trước khi nộp.';$('nm').focus();window.scrollTo({top:0,behavior:'smooth'});return;}
  const left=TOTAL-Object.keys(sel).length;
  if(left>0&&!confirmed){confirmed=true;w.className='';w.textContent='Con còn '+left+' câu chưa làm. Bấm “Nộp bài” lần nữa nếu muốn nộp luôn.';return;}
  w.textContent='';const R=grade(),ten=(R.ok*10/TOTAL).toFixed(2).replace(/\.?0+$/,'');
  $('rb').textContent=R.ok+'/'+TOTAL;$('ring').style.setProperty('--p',(R.ok/TOTAL*100)+'%');$('rem').textContent=R.ok/TOTAL>=.9?'🏆 Xuất sắc!':R.ok/TOTAL>=.7?'🌟 Rất tốt!':R.ok/TOTAL>=.5?'💪 Khá rồi, cố lên!':'🎵 Cùng ôn lại nhé!';if(R.ok/TOTAL>=.7)confetti();$('rt').textContent=ten+' / 10 điểm';$('rw').textContent=$('nm').value.trim()+' · Lớp '+$('cl').value.trim()+' · '+fmt(Math.round((tEnd-T0)/1000));
  $('rk').innerHTML=Object.keys(TEST.groups).map(k=>'<div><span>'+TEST.groups[k].short+'</span><b>'+R.by[k].ok+'/'+R.by[k].t+'</b></div>').join('');
  $('res').classList.add('on');$('sub').disabled=true;$('sub').textContent='Đã nộp';$('res').scrollIntoView({behavior:'smooth'});
  const nm=$('nm').value.trim(),cl=$('cl').value.trim();
  payload={access_key:CFG.MAIL_ACCESS_KEY,subject:'['+TEST.title+'] '+nm+' – Lớp '+cl+' – '+R.ok+'/'+TOTAL,from_name:'Kiểm tra Unit 4 – '+nm,name:nm,class:cl,score:R.ok+'/'+TOTAL+' ('+ten+'/10)',message:text(R)};
  sendMail();
};
$('top').onclick=()=>$('quiz').scrollIntoView({behavior:'smooth'});
$('cp').onclick=()=>{const t=payload?payload.message:'',done=()=>{$('cp').textContent='Đã sao chép';};try{navigator.clipboard.writeText(t).then(done,()=>{});}catch(e){}};
</script>
</body>
</html>
